name: Build feeds

on:
  schedule:
    - cron: "0 */6 * * *"   # প্রতি ৬ ঘণ্টায়
  workflow_dispatch:         # হাতে চালানোর বোতাম

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 curl_cffi
      - run: python scrape.py
      - name: Commit feeds
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update feeds"
          git push
